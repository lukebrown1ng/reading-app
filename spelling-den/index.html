<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Spelling Den</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Spelling Den">
<meta name="theme-color" content="#eafaf0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <a class="brand" href="../index.html">🦕 <span>Spelling Den</span></a>
      <div class="top-bar-actions">
        <button id="streakPill" class="week-pill" type="button" aria-label="See my daily streak and scores">
          <span id="streakPillLabel" class="week-pill-label">📅</span>
        </button>
        <button id="historyBtn" class="week-pill" type="button" aria-label="See my past scores">
          <span aria-hidden="true">🏆</span>
          <span class="week-pill-label">My scores</span>
        </button>
        <button id="weekPill" class="week-pill" type="button" aria-label="Choose which week's words to play">
          <span aria-hidden="true">📅</span>
          <span id="weekPillLabel" class="week-pill-label">Week 1</span>
        </button>
      </div>
    </header>

    <div id="focusCallout" class="focus-callout" hidden>
      <span class="focus-callout-label">⭐ Key focus</span>
      <span id="focusCalloutText" class="focus-callout-text"></span>
    </div>

    <main id="playArea" class="game-area">
      <div class="progress-row">
        <div id="wordProgressLabel" class="word-progress-label">Word 1 of 10</div>
        <div id="progressDots" class="progress-dots"></div>
      </div>

      <button id="hearBtn" class="hear-btn" type="button" aria-label="Hear the word">
        🔊 <span>Hear the word</span>
      </button>
      <button id="hearSentenceBtn" class="hear-sentence-btn" type="button" hidden>
        💬 <span>Hear it in a sentence</span>
      </button>

      <div id="blanksRow" class="blanks-row"></div>

      <div id="letterTray" class="letter-tray"></div>

      <button id="checkBtn" class="check-btn" type="button" disabled>✓ Check</button>

      <div id="modeToggle" class="mode-toggle" role="group" aria-label="How to enter letters">
        <button id="modeTilesBtn" class="mode-btn" type="button" aria-pressed="true">🔀 Tiles</button>
        <button id="modeTypeBtn" class="mode-btn" type="button" aria-pressed="false">⌨️ Type</button>
      </div>

    </main>

    <div id="roundComplete" class="round-complete" hidden>
      <div class="round-complete-card">
        <div class="round-complete-emoji">🎉🦕🎉</div>
        <div id="roundCompleteScore" class="round-complete-score"></div>

        <div id="correctWordsBlock" class="result-block" hidden>
          <p class="result-block-label">✅ Right first time</p>
          <div id="correctWordList" class="result-word-list"></div>
        </div>

        <div id="retryWordsBlock" class="result-block" hidden>
          <p class="result-block-label">🔁 Wrong at first, then got it</p>
          <div id="retryWordList" class="result-word-list"></div>
        </div>

        <div id="practiceWordsBlock" class="result-block" hidden>
          <p class="result-block-label">🌱 Got wrong — to practise</p>
          <div id="practiceWordList" class="result-word-list"></div>
        </div>

        <button id="playAgainBtn" class="play-again-btn" type="button">Play this week again</button>
        <button id="practiceTrickyBtn" class="play-again-btn year-select-btn-alt practice-tricky-btn" type="button" hidden>🌱 Practise my tricky words</button>
        <a class="back-home-link" href="../index.html">&larr; back home</a>
      </div>
    </div>

    <footer class="progress-footer">
      <a class="parent-link" href="../parent.html">parent</a>
    </footer>
  </div>

  <div id="yearSelect" class="year-select">
    <div class="year-select-card">
      <div class="round-complete-emoji">🦕</div>
      <h2 class="year-select-heading">Spelling Den</h2>
      <p class="year-select-sub">Which spellings today?</p>
      <button id="year3Btn" class="play-again-btn year-select-btn" type="button">Year 3</button>
      <button id="year5Btn" class="play-again-btn year-select-btn year-select-btn-alt" type="button">Year 5</button>
      <a class="back-home-link" href="../index.html">&larr; back home</a>
    </div>
  </div>

  <div id="wrongFeedback" class="week-picker-modal wrong-modal" hidden>
    <div class="wrong-feedback">
      <p class="wrong-feedback-label modal-title">That's tricky — here's how it's spelled:</p>
      <div id="correctSpellingWord" class="correct-spelling-word"></div>
      <div class="wrong-feedback-actions">
        <button id="tryAgainBtn" class="try-again-btn" type="button">Try again</button>
        <button id="skipWordBtn" class="skip-word-btn" type="button">Next word →</button>
      </div>
    </div>
  </div>

  <div id="weekPickerModal" class="week-picker-modal" hidden>
    <div class="week-picker-card">
      <button id="weekPickerCloseBtn" class="modal-close-btn" type="button" aria-label="Close">✕</button>
      <h3 class="week-picker-heading">Pick a week</h3>
      <div id="weekPickerList" class="week-picker-list"></div>
    </div>
  </div>

  <div id="historyModal" class="week-picker-modal" hidden>
    <div class="week-picker-card">
      <button id="historyCloseBtn" class="modal-close-btn" type="button" aria-label="Close">✕</button>
      <h3 id="historyHeading" class="week-picker-heading">My scores</h3>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="js/weeks.js"></script>
  <script src="js/sentences.js"></script>
  <script src="js/state.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
