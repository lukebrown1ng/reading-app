<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spelling Den</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Spelling Den">
<meta name="theme-color" content="#0f5a3c">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Dino art for the themes: coloured per theme with --dino-body / --dino-spike / --dino-line. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="dino-sym" viewBox="0 0 120 120">
      <g style="stroke:var(--dino-line,none);stroke-width:3;stroke-linejoin:round">
        <path d="M6 96 Q22 92 30 78 L40 96 Z" style="fill:var(--dino-body,#2ee6c5)"/>
        <rect x="40" y="94" width="14" height="18" rx="6" style="fill:var(--dino-body,#2ee6c5)"/>
        <rect x="66" y="94" width="14" height="18" rx="6" style="fill:var(--dino-body,#2ee6c5)"/>
        <ellipse cx="58" cy="78" rx="34" ry="26" style="fill:var(--dino-body,#2ee6c5)"/>
        <circle cx="82" cy="46" r="24" style="fill:var(--dino-body,#2ee6c5)"/>
        <path d="M40 56 L46 40 L54 54 Z M54 52 L62 34 L70 50 Z" style="fill:var(--dino-spike,#ff5fa8)"/>
      </g>
      <circle cx="90" cy="42" r="7" fill="#fff"/><circle cx="92" cy="42" r="3.5" fill="#111"/>
      <path d="M84 58 Q94 64 102 56" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="dino-pix" viewBox="0 0 120 120" shape-rendering="crispEdges">
      <g style="fill:var(--dino-body,#00ff88)"><rect x="24" y="60" width="60" height="36"/><rect x="60" y="24" width="48" height="48"/><rect x="12" y="84" width="16" height="12"/><rect x="36" y="96" width="16" height="16"/><rect x="64" y="96" width="16" height="16"/></g>
      <g style="fill:var(--dino-spike,#ff3df2)"><rect x="36" y="48" width="12" height="12"/><rect x="52" y="40" width="12" height="20"/></g>
      <rect x="84" y="36" width="12" height="12" fill="#fff"/><rect x="90" y="40" width="6" height="6" fill="#14052e"/>
    </symbol>
  </svg>
  <div class="app">
    <header class="top-bar">
      <a class="brand" href="../index.html"><span class="brand-dino"><span class="dino-emoji">🦕</span><svg class="dino-svg dino-smooth" aria-hidden="true"><use href="#dino-sym"/></svg><svg class="dino-svg dino-pixel" aria-hidden="true"><use href="#dino-pix"/></svg></span> <span>Spelling Den</span></a>
      <div class="top-bar-actions">
        <div id="modeToggle" class="mode-toggle" role="group" aria-label="How to enter letters">
          <button id="modeTilesBtn" class="mode-btn" type="button" aria-pressed="true">🔀 Tiles</button>
          <button id="modeTypeBtn" class="mode-btn" type="button" aria-pressed="false">⌨️ Type</button>
        </div>
        <button id="historyBtn" class="week-pill" type="button">🏆 My scores</button>
        <button id="grownupsBtn" class="week-pill" type="button">For grown-ups</button>
      </div>
    </header>

    <main id="playArea" class="game-area">
      <div id="focusCallout" class="focus-callout">
        <span id="focusCalloutLabel" class="focus-callout-label">Key focus</span>
        <span id="focusCalloutText" class="focus-callout-text"></span>
      </div>
      <div class="play-left">
      <div class="progress-row">
        <div id="wordProgressLabel" class="word-progress-label">Word 1 of 10</div>
        <div id="progressDots" class="progress-dots"></div>
      </div>
      <div id="dino" class="dino" aria-hidden="true"><span class="dino-emoji">🦖</span><svg class="dino-svg dino-smooth" aria-hidden="true"><use href="#dino-sym"/></svg><svg class="dino-svg dino-pixel" aria-hidden="true"><use href="#dino-pix"/></svg></div>
      <div id="cheer" class="cheer" aria-hidden="true"></div>
      <p id="liveStatus" class="sr-only" role="status" aria-live="polite"></p>
      <button id="hearBtn" class="hear-btn" type="button" aria-label="Hear the word">
        🔊 <span>Hear the word</span>
      </button>
      <button id="hearSentenceBtn" class="hear-sentence-btn" type="button" hidden>
        💬 <span>Hear it in a sentence</span>
      </button>
      </div>

      <div class="play-right">
      <div id="blanksRow" class="blanks-row"></div>

      <div id="letterTray" class="letter-tray"></div>

      <button id="checkBtn" class="check-btn" type="button" disabled>✓ Check</button>
      </div>
    </main>

    <div id="roundComplete" class="round-complete" hidden>
      <div class="round-complete-card">
        <div id="roundCompleteDino" class="round-complete-dino" aria-hidden="true"><span class="dino-emoji">🦖</span><svg class="dino-svg dino-smooth" aria-hidden="true"><use href="#dino-sym"/></svg><svg class="dino-svg dino-pixel" aria-hidden="true"><use href="#dino-pix"/></svg></div>
        <div id="roundCompleteEggs" class="progress-dots round-complete-eggs" aria-hidden="true"></div>
        <div class="round-complete-score">
          <strong id="roundCompleteScore" class="round-complete-number"></strong>
          <span id="roundCompleteCaption" class="round-complete-caption"></span>
        </div>

        <button id="playAgainBtn" class="play-again-btn" type="button">Play this week again</button>
        <button id="practiceTrickyBtn" class="play-again-btn year-select-btn-alt practice-tricky-btn" type="button" hidden>🌱 Practise my tricky words</button>

        <details class="result-details">
          <summary>See my words</summary>
          <div id="correctWordsBlock" class="result-block" hidden>
            <p class="result-block-label">✅ Right first time</p>
            <div id="correctWordList" class="result-word-list"></div>
          </div>

          <div id="retryWordsBlock" class="result-block" hidden>
            <p class="result-block-label">🔁 Wrong at first, then got it</p>
            <div id="retryWordList" class="result-word-list"></div>
          </div>

          <div id="practiceWordsBlock" class="result-block" hidden>
            <p class="result-block-label">🌱 To practise next time</p>
            <div id="practiceWordList" class="result-word-list"></div>
          </div>
        </details>

        <a class="back-home-link" href="../index.html">&larr; back home</a>
      </div>
    </div>
  </div>

  <div id="yearSelect" class="year-select">
    <div class="year-select-card">
      <div class="round-complete-emoji"><span class="dino-emoji">🦕</span><svg class="dino-svg dino-smooth" aria-hidden="true"><use href="#dino-sym"/></svg><svg class="dino-svg dino-pixel" aria-hidden="true"><use href="#dino-pix"/></svg></div>
      <h2 class="year-select-heading">Spelling Den</h2>
      <p class="year-select-sub">Which spellings today?</p>
      <button id="year3Btn" class="play-again-btn year-select-btn" type="button">Year 3</button>
      <button id="year5Btn" class="play-again-btn year-select-btn year-select-btn-alt" type="button">Year 5</button>
      <a class="back-home-link" href="../index.html">&larr; back home</a>
    </div>
  </div>

  <div id="wrongFeedback" class="week-picker-modal wrong-modal" hidden>
    <div class="wrong-feedback">
      <p class="wrong-feedback-label modal-title">That's a tricky one! It's spelled:</p>
      <div id="correctSpellingWord" class="correct-spelling-word"></div>
      <div class="wrong-feedback-actions">
        <button id="tryAgainBtn" class="try-again-btn" data-escape type="button">Try again</button>
        <button id="skipWordBtn" class="skip-word-btn" type="button">Next word →</button>
      </div>
    </div>
  </div>

  <div id="grownupsModal" class="week-picker-modal" hidden>
    <div class="week-picker-card">
      <button id="grownupsCloseBtn" class="modal-close-btn" type="button" aria-label="Close">✕</button>
      <h3 class="week-picker-heading">For grown-ups</h3>
      <p id="streakPillLabel" class="grownups-streak"></p>
      <div class="grownups-actions">
        <button id="weekPill" class="week-pill" type="button">
          📅 <span id="weekPillLabel">Week 1</span> &middot; change week
        </button>
        <a class="parent-link" href="../parent.html">parent</a>
      </div>
    </div>
  </div>

  <div id="weekPickerModal" class="week-picker-modal" hidden>
    <div class="week-picker-card">
      <button id="weekPickerCloseBtn" class="modal-close-btn" type="button" aria-label="Close">✕</button>
      <h3 class="week-picker-heading">Pick a week</h3>
      <div id="weekPickerList" class="week-picker-list"></div>
    </div>
  </div>

  <div id="historyModal" class="week-picker-modal" hidden>
    <div class="week-picker-card">
      <button id="historyCloseBtn" class="modal-close-btn" type="button" aria-label="Close">✕</button>
      <h3 id="historyHeading" class="week-picker-heading">My scores</h3>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <link rel="stylesheet" href="css/themes-spelling.css">
  <script src="../js/common.js"></script>
  <script src="js/weeks.js"></script>
  <script src="js/sentences.js"></script>
  <script src="js/state.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
