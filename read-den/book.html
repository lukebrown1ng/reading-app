<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reading Den — Read a Book</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Read a Book">
<meta name="theme-color" content="#eafaf0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <a class="icon-link" href="index.html" aria-label="All books">📚</a>
      <h1 id="bookTitle" class="book-heading">Read a Book</h1>
      <a class="icon-link" href="../index.html" aria-label="Reading Den home">🏠</a>
    </header>

    <div id="pips" class="pips" role="img" aria-label="Page progress"></div>

    <main id="readerArea" class="reader-area">
      <div id="pageCard" class="page-card">
        <p id="pageText" class="page-text"></p>
      </div>

      <div class="help-slot">
        <button id="hearWordBtn" class="hear-word-btn" type="button" hidden></button>
      </div>

      <p id="statusLine" class="status-line" role="status" aria-live="polite"></p>

      <div class="controls">
        <button id="narrateBtn" class="side-btn" type="button">
          <span class="side-icon" aria-hidden="true">🔊</span>
          <span>Hear it</span>
        </button>
        <button id="micBtn" class="mic-btn" type="button" data-state="off" hidden>
          <span class="mic-icon" aria-hidden="true">🎤</span>
          <span id="micLabel" class="mic-label">Read out loud</span>
        </button>
      </div>
    </main>

    <section id="endCard" class="end-card" hidden>
      <div class="end-cover" id="endCover" aria-hidden="true"></div>
      <h2 class="end-title">The End</h2>
      <p class="end-sub" id="endSub">Lovely reading!</p>
      <div class="end-actions">
        <a id="nextBookBtn" class="end-btn primary" href="index.html">Next book ▶</a>
        <button id="againBtn" class="end-btn" type="button">↻ Read it again</button>
        <a class="end-btn" href="index.html">📚 All books</a>
      </div>
    </section>

    <footer class="reader-footer">
      <div id="navRow" class="nav-row">
        <button id="prevBtn" class="nav-btn" type="button">◀ Back</button>
        <button id="nextBtn" class="nav-btn" type="button">Next ▶</button>
      </div>
      <a class="parent-link" href="../parent.html">parent</a>
    </footer>
  </div>

  <script src="../js/common.js"></script>
  <script src="js/books.js"></script>
  <script src="js/state.js"></script>
  <script src="js/narration.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/speech-recognition.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
